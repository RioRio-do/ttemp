# CI/CD（docs/SIGNING.md）
#
# - PR と main への push: ビルドとテスト
# - main への push（テスト通過後）: 全自動リリース
#     バージョン採番（major.minor は project.yml、patch はコミット数）
#     → 「Ttemp Signing」で安定署名 → EdDSA 署名つき appcast 生成
#     → GitHub Release 作成（初回用DMG + Sparkle用ZIP/appcast.xmlを添付）
#   本文はrelease-notes/の未公開の日英ノートを使う。ノートなしの公開は停止する。
#   リリースしたくない push はコミット件名の先頭に [skip release] を付ける。
#
# 必要なシークレット（scripts/setup-release-keys.sh が登録する）:
#   SIGNING_CERT_P12 / SIGNING_CERT_PASSWORD / SPARKLE_ED_PRIVATE_KEY
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release_notes:
    name: 配布スクリプト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 日英ノートと生成処理を検証
        run: |
          python3 scripts/release-notes.py check
          python3 -B -m unittest discover -s Tests/ReleaseNotes -v
      - name: 診断の起動制限と更新fixtureを検証
        run: python3 -B -m unittest discover -s Tests/Distribution -v

  checks:
    name: 検証 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: XcodeGen を入れる
        run: ./scripts/install-xcodegen.sh "$RUNNER_TEMP/ttemp-tools" >> "$GITHUB_PATH"
      - name: アプリをビルド
        run: |
          xcodegen generate
          xcodebuild -project Ttemp.xcodeproj -scheme Ttemp -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: テスト
        run: |
          xcodebuild -project Ttemp.xcodeproj -scheme TtempTests \
            -configuration Debug -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: 自己署名したReleaseの実起動とZIP往復を検証
        timeout-minutes: 15
        run: ./scripts/test-release.sh

  # Keep this exact context name: main branch protection requires it.
  test:
    name: ビルドとテスト
    needs: [checks, release_notes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 全環境の検証成功を要求
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          NOTES_RESULT: ${{ needs.release_notes.result }}
        run: test "$CHECK_RESULT" = success && test "$NOTES_RESULT" = success

  release:
    name: リリース
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, '[skip release]')
    runs-on: macos-15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # コミット数からバージョンを採番するため全履歴が要る
          fetch-depth: 0
          persist-credentials: false

      - name: XcodeGen を入れる
        run: ./scripts/install-xcodegen.sh "$RUNNER_TEMP/ttemp-tools" >> "$GITHUB_PATH"

      - name: バージョンを決める
        id: version
        run: |
          VERSION=$(python3 scripts/release-notes.py version)
          BUILD=${VERSION##*.}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "リリース: v$VERSION (build $BUILD)"

      - name: 公開済みReleaseからのノートを確認
        env:
          GH_TOKEN: ${{ github.token }}
          TTEMP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Failed releases can leave tags behind. Use the latest published Release,
          # and fail closed on API errors instead of silently reusing old notes.
          PREVIOUS_TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          python3 scripts/release-notes.py render --since "$PREVIOUS_TAG" --version "$TTEMP_VERSION" > /dev/null
          echo "TTEMP_PREVIOUS_RELEASE=$PREVIOUS_TAG" >> "$GITHUB_ENV"

      - name: 署名用キーチェーンを用意
        timeout-minutes: 2
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            echo "署名シークレットが未設定。scripts/setup-release-keys.sh を実行すること" >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "TTEMP_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$SIGNING_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          # importの前にbase64破損とpassword不一致を切り分ける。macOS 15の
          # Security.frameworkと互換な形式への再梱包はsetup scriptが担う。
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" \
            -passin env:SIGNING_CERT_PASSWORD -noout

          echo "==> 使い捨てキーチェーンを作成"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # runner専用の使い捨てkeychainなので、秘密鍵のACLは全processへ開く。
          # これによりGUI確認が必要なpartition-list変更を避けられる。
          echo "==> PKCS#12 identityを取り込み"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$SIGNING_CERT_PASSWORD" -A -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"

          # macOS 15のheadless runnerではtrust変更がGUI認証待ちになるため、user/Systemの
          # trust storeは一切変更しない。証明書fingerprintをXcodeへ直接渡して署名する。
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:SIGNING_CERT_PASSWORD \
            -clcerts -nokeys -out "$RUNNER_TEMP/cert.pem"
          grep -Fq 'CN=Ttemp Signing' <(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -subject -nameopt RFC2253)
          SIGN_IDENTITY=$(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -fingerprint -sha1 | sed 's/^.*=//; s/://g')
          [[ "$SIGN_IDENTITY" =~ ^[0-9A-F]{40}$ ]]
          security find-certificate -a -Z "$KEYCHAIN" | grep -Fq "SHA-1 hash: $SIGN_IDENTITY"
          echo "TTEMP_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "==> 署名identity fingerprintを確認"

      - name: リリースビルドと配布物生成
        timeout-minutes: 20
        env:
          TTEMP_VERSION: ${{ steps.version.outputs.version }}
          TTEMP_BUILD: ${{ steps.version.outputs.build }}
          # Explicit opt-in, additionally checked against GitHub's hosted-runner variables.
          TTEMP_DISPOSABLE_CI: "1"
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "SPARKLE_ED_PRIVATE_KEY が未設定。scripts/setup-release-keys.sh を実行すること" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          TTEMP_ED_KEY_FILE="$RUNNER_TEMP/ed_key" ./scripts/build-release.sh
          rm -f "$RUNNER_TEMP/ed_key"

      - name: GitHub Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          EXISTING_TARGET=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -n "$EXISTING_TARGET" ] && [ "$EXISTING_TARGET" != "$GITHUB_SHA" ]; then
            echo "$TAG は別commit $EXISTING_TARGET を指しています。" >&2
            exit 1
          fi
          gh release create "$TAG" \
            dist/Ttemp.dmg dist/Ttemp.zip dist/appcast.xml dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Ttemp ${{ steps.version.outputs.version }}" \
            --notes-file "dist/release-notes-v${{ steps.version.outputs.version }}.md"

      - name: 署名用一時ファイルを片付ける
        if: always()
        run: |
          if [ -n "${TTEMP_KEYCHAIN:-}" ]; then
            security delete-keychain "$TTEMP_KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/ed_key"
