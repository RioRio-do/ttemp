name: Ttemp

options:
  bundleIdPrefix: com.am921
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
  configs:
    Release:
      # UI アプリなので速度より小ささを優先する（体感差はない）
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      LLVM_LTO: YES
      DEAD_CODE_STRIPPING: YES
      # 配布バイナリからシンボルを落とす
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      # Mirror / リフレクションは使っていない（Codable はコンパイル時生成なので無関係）
      SWIFT_REFLECTION_METADATA_LEVEL: none

targets:
  Ttemp:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "App/Info.plist"
    settings:
      base:
        PRODUCT_NAME: Ttemp
        PRODUCT_BUNDLE_IDENTIFIER: com.am921.ttemp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/App/Info.plist
        # SPEC §11.2: 入力監視権限は App Sandbox 内では取得できない
        ENABLE_APP_SANDBOX: NO
        # SPEC §12: 最初から有効化しておく（後付けは権限周りの再検証が必要）
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES

  TtempTests:
    type: bundle.unit-test
    platform: macOS
    # SPEC §13: 純粋ロジックのみをテストする。アプリをテストホストにせず、
    # 対象ソースを直接テストターゲットに含める（常駐アプリをホストにすると不安定）。
    sources:
      - path: Tests/TtempTests
      - path: Sources/Hotkey/ShiftChordDetector.swift
      - path: Sources/Note/WindowPlacement.swift
      - path: Sources/Util/PlainTextSanitizer.swift
      - path: Sources/Util/FontSizeModel.swift
      - path: Sources/Model/NoteContent.swift
      - path: Sources/Model/AppState.swift
      - path: Sources/Model/StateStore.swift
      - path: Sources/Util/PasteboardReader.swift
      - path: Sources/Util/ImageWindowSizing.swift
      - path: Sources/Util/ImageExporter.swift
      - path: Sources/Util/FontSizeShortcut.swift
      - path: Sources/Settings/LocalModifier.swift
      - path: Sources/App/AppInfo.swift
      - path: Sources/Util/UpdateChecker.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.am921.ttemp.tests
        GENERATE_INFOPLIST_FILE: YES
