name: Ttemp

packages:
  # 自動更新（docs/SIGNING.md）。更新パッケージの検証は Sparkle の EdDSA 鍵で行うため
  # Apple Developer アカウントは不要（アプリ本体は自己署名のまま）
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # 更新機構は配布物を扱う高信頼境界なので、CI/Release の再現性を保つため厳密に固定する。
    exactVersion: "2.9.6"

options:
  bundleIdPrefix: com.am921
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES
  configs:
    Release:
      # UI アプリなので速度より小ささを優先する（体感差はない）
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      LLVM_LTO: YES
      DEAD_CODE_STRIPPING: YES
      # 配布バイナリからシンボルを落とす
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      # Mirror / リフレクションは使っていない（Codable はコンパイル時生成なので無関係）
      SWIFT_REFLECTION_METADATA_LEVEL: none

targets:
  Ttemp:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "App/Info.plist"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Ttemp
        PRODUCT_BUNDLE_IDENTIFIER: com.am921.ttemp
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/App/Info.plist
        # 現行配布は自己署名・Sparkle更新を含む非Sandbox構成。入力監視はTCCで別途許可を得る。
        ENABLE_APP_SANDBOX: NO
        # SPEC §12: 最初から有効化しておく（後付けは権限周りの再検証が必要）
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES

  TtempTests:
    type: bundle.unit-test
    platform: macOS
    # SPEC §13: 純粋ロジックのみをテストする。アプリをテストホストにせず、
    # 対象ソースを直接テストターゲットに含める（常駐アプリをホストにすると不安定）。
    sources:
      - path: Tests/TtempTests
      - path: Sources/Hotkey/ShiftChordDetector.swift
      - path: Sources/Note/WindowPlacement.swift
      - path: Sources/Util/PlainTextSanitizer.swift
      - path: Sources/Util/FontSizeModel.swift
      - path: Sources/Model/NoteContent.swift
      - path: Sources/Model/AppState.swift
      - path: Sources/Model/StateStore.swift
      - path: Sources/Util/PasteboardReader.swift
      - path: Sources/Util/ImageWindowSizing.swift
      - path: Sources/Util/ImageExporter.swift
      - path: Sources/Util/ImageStore.swift
      - path: Sources/Util/FontSizeShortcut.swift
      - path: Sources/Settings/LocalModifier.swift
      - path: Sources/Settings/NewWindowPinMode.swift
      - path: Sources/Settings/Preferences.swift
      - path: Sources/Util/L10n.swift
      - path: Sources/App/ApplicationLocation.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.am921.ttemp.tests
        GENERATE_INFOPLIST_FILE: YES
